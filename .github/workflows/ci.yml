name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test

  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      # On a pull request HEAD is GitHub's test merge, so HEAD^1 is the base
      # branch; on a push to main HEAD^1 is the commit before the merge. Either
      # way the diff is exactly what this run brings in.
      - id: diff
        run: |
          # If the comparison itself fails, run the Rust checks anyway.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qE '^(src-tauri/|test-fixtures/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (format, lint, test)
    # Skipped when nothing the Rust side reads changed; a skipped job counts
    # as passing. Rust changes are also checked on the maintainer's Mac.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Linux runners are always available; macOS runners can queue for hours.
    # The Mac-only behavior (case-insensitive names) is checked by running
    # the same commands on the maintainer's Mac (see AGENTS.md).
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes; a hung package mirror once held a
    # runner for 48 minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri's Linux system libraries
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
