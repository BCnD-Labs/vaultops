name: PR rules

# Checks each pull request against the AGENTS.md rules: links its issue, has
# Tested / Not tested sections and a "Based on" line (red X if missing), stays
# roughly under 400 changed lines, lock files aside (warning only), and removes
# "Generated with Claude Code" footers and session links from the description.
# Logic and tests: .github/scripts/pr-rules.cjs. Pull requests from forks get a
# read-only token, so for them the result shows on the run page only.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # edit the description, post the comment
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Test the checker
        run: node --test .github/scripts/pr-rules.test.cjs
      - name: Check this pull request
        uses: actions/github-script@v9
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-rules.cjs`);
            await run({ github, context, core });
