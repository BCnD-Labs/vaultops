[package]
name = "vaultops"
version = "0.0.0"
description = "VaultOps desktop app"
authors = ["BCnD Labs"]
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "vaultops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cap-std = "4.0.3"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
